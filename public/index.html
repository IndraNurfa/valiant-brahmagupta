<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Lookup</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Design Tokens ─────────────────────────────────────────── */
      :root {
        --bg: #18181a;
        --surface: #222224;
        --surface-2: #2b2b2d;
        --border: #38383a;
        --border-soft: #323234;
        --text: #f0ede8;
        --text-muted: #a09a90;
        --text-dim: #6b6560;
        --accent: #c49a3c;
        --accent-glow: rgba(196, 154, 60, 0.15);
        --accent-hover: #c49a3c;
        --success: #6ab86a;
        --success-bg: rgba(106, 184, 106, 0.08);
        --warn: #c8a84a;
        --warn-bg: rgba(200, 168, 74, 0.08);
        --danger: #d47070;
        --danger-bg: rgba(212, 112, 112, 0.08);
        --info: #7eaed4;
        --info-bg: rgba(126, 174, 212, 0.08);
        --radius: 12px;
        --radius-sm: 8px;
        --radius-xs: 6px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
        --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ── Reset & Base ──────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background-image: none;
      }

      /* ── Card ──────────────────────────────────────────────────── */
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      /* ── Card Header ───────────────────────────────────────────── */
      .card-header {
        padding: 1.75rem 2rem 1.5rem;
        border-bottom: 1px solid var(--border-soft);
        background: var(--surface);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        margin-bottom: 0.375rem;
      }

      .brand-icon {
        width: 32px;
        height: 32px;
        background: var(--surface-2);
        border-radius: var(--radius-xs);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .brand-icon svg {
        width: 17px;
        height: 17px;
        fill: var(--accent);
      }

      .brand-name {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .card-subtitle {
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
      }

      /* ── Card Body ─────────────────────────────────────────────── */
      .card-body {
        padding: 1.75rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      /* ── Input Group ───────────────────────────────────────────── */
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .input-label {
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.01em;
      }

      .input-row {
        display: flex;
        gap: 0.625rem;
      }

      .phone-input {
        flex: 1;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: 'DM Mono', monospace;
        font-size: 1rem;
        font-weight: 500;
        padding: 0.75rem 1rem;
        outline: none;
        transition:
          border-color var(--transition),
          box-shadow var(--transition);
        width: 100%;
        letter-spacing: 0.02em;
      }

      .phone-input::placeholder {
        color: var(--text-dim);
      }

      .phone-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      .check-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--accent);
        color: #18181a;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition:
          background var(--transition),
          transform var(--transition),
          box-shadow var(--transition);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .check-btn:active:not(:disabled) {
        transform: translateY(0);
      }

      .check-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .check-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
        flex-shrink: 0;
      }

      /* ── Hint ──────────────────────────────────────────────────── */
      .hint {
        font-size: 0.75rem;
        color: var(--text-dim);
        letter-spacing: 0.01em;
      }

      /* ── Spinner ───────────────────────────────────────────────── */
      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Result Panel ──────────────────────────────────────────── */
      .result-panel {
        display: none;
        flex-direction: column;
        gap: 0.75rem;
        animation: fadeSlideIn 0.3s ease both;
      }

      .result-panel.visible {
        display: flex;
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Result Row ────────────────────────────────────────────── */
      .result-row {
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-sm);
        padding: 1rem 1.125rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .result-row-label {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      .result-row-value {
        font-size: 0.9375rem;
        font-weight: 500;
        color: var(--text);
      }

      .result-row-value.mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .result-row-value.dim {
        color: var(--text-muted);
      }
      .result-row-value.success {
        color: var(--success);
      }
      .result-row-value.warn {
        color: var(--warn);
      }
      .result-row-value.danger {
        color: var(--danger);
      }
      .result-row-value.info {
        color: var(--info);
      }

      /* ── OTP Block ─────────────────────────────────────────────── */
      .otp-row {
        border-color: var(--border-soft);
        position: relative;
      }

      .otp-code-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .copy-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius-xs);
        color: var(--text-muted);
        font-family: 'DM Sans', sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.3125rem 0.75rem;
        cursor: pointer;
        flex-shrink: 0;
      }

      .copy-btn.copied {
        border-color: var(--success);
        color: var(--success);
        background: var(--success-bg);
      }

      .copy-btn svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      .sent-at {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.125rem;
        font-family: 'DM Sans', sans-serif;
      }

      /* ── Status Badge ──────────────────────────────────────────── */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.3125rem 0.75rem;
        border-radius: 100px;
      }

      .status-badge.success {
        background: var(--success-bg);
        color: var(--success);
      }
      .status-badge.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .status-badge.danger {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .status-badge.info {
        background: var(--info-bg);
        color: var(--info);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      /* ── Divider ───────────────────────────────────────────────── */
      .divider {
        height: 1px;
        background: var(--border-soft);
      }

      /* ── CS message styling removed */

      /* ── Save row ───────────────────────────────────────── */
      .save-row {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .form-bottom {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 0.375rem;
      }

      .save-row input[type="checkbox"] {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        accent-color: var(--accent);
        cursor: pointer;
        margin: 0;
      }

      .save-row label {
        font-size: 0.75rem;
        color: var(--text-muted);
        cursor: pointer;
        font-weight: 400;
      }

      .save-row input[type="checkbox"]:disabled,
      .save-row input[type="checkbox"]:disabled + label {
        opacity: 0.5;
        cursor: default;
      }

      /* ── Saved numbers ────────────────────────────────────────── */
      .saved-section {
        margin-top: 0.75rem;
      }

      .saved-label {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 0.4rem;
      }

      .saved-list {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .saved-entry {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.4375rem 0.625rem;
        flex-wrap: wrap;
      }

      .saved-fill {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1px;
        cursor: pointer;
        min-width: 0;
      }

      .saved-alias {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .saved-phone {
        font-family: 'DM Mono', monospace;
        font-size: 0.725rem;
        color: var(--text-muted);
      }

      .saved-phone-only {
        font-family: 'DM Mono', monospace;
        font-size: 0.8125rem;
        color: var(--text);
      }

      .saved-icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.25rem;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--text-dim);
      }

      .saved-icon-btn svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .saved-icon-btn.delete svg { stroke: var(--danger); }
      .saved-icon-btn.edit svg   { stroke: var(--text-dim); }

      .alias-edit-row {
        width: 100%;
        display: flex;
        gap: 0.3125rem;
        align-items: center;
        margin-top: 0.3rem;
      }

      .alias-input {
        flex: 1;
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 4px;
        color: var(--text);
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 0.8125rem;
        padding: 0.25rem 0.5rem;
        outline: none;
      }

      .alias-save-btn {
        background: var(--accent);
        border: none;
        border-radius: 4px;
        color: #18181a;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.25rem 0.625rem;
        cursor: pointer;
        white-space: nowrap;
      }

      /* ── Responsive ────────────────────────────────────────────── */
      @media (max-width: 520px) {
        body {
          padding: 1rem 0.75rem;
        }
        .card-header,
        .card-body {
          padding-left: 1.25rem;
          padding-right: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card" aria-label="Phone Role and OTP Lookup Tool">
        <!-- Header -->
        <header class="card-header">
          <div class="brand">
            <div class="brand-icon" aria-hidden="true">
              <!-- Phone icon -->
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
                />
              </svg>
            </div>
            <span class="brand-name">Internal Tool</span>
          </div>
          <h1 class="card-title">Phone Lookup</h1>
          <p class="card-subtitle">Look up user role &amp; retrieve the latest OTP</p>
        </header>

        <!-- Body -->
        <div class="card-body">
          <!-- Input -->
          <div class="input-group">
            <label class="input-label" for="phone-input">Phone Number</label>
            <div class="input-row">
              <input
                id="phone-input"
                class="phone-input"
                type="tel"
                placeholder="0812 345 6789"
                autocomplete="off"
                spellcheck="false"
                aria-label="Enter phone number"
              />
              <button
                id="check-btn"
                class="check-btn"
                type="button"
                aria-label="Check phone number"
              >
                <span class="spinner" id="spinner" aria-hidden="true"></span>
                <svg
                  id="btn-icon"
                  viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path
                    d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                  />
                </svg>
                <span id="btn-label">Check</span>
              </button>
            </div>
            <div class="form-bottom">
              <p class="hint">Accepts: 0812…, 812…, 62812…, +62812…</p>
              <div class="save-row">
                <input type="checkbox" id="save-cb">
                <label for="save-cb">Save</label>
              </div>
            </div>

            <!-- Saved numbers -->
            <div class="saved-section" id="saved-section" style="display:none">
              <div class="saved-label">Saved</div>
              <div class="saved-list" id="saved-list"></div>
            </div>
          </div>

          <!-- Result -->
          <div
            class="result-panel"
            id="result-panel"
            role="region"
            aria-live="polite"
            aria-label="Lookup Result"
          >
            <!-- Role Row -->
            <div class="result-row" id="role-row">
              <span class="result-row-label">User Role</span>
              <span class="result-row-value" id="role-value" aria-label="Role result"></span>
            </div>

            <div class="divider"></div>

            <!-- OTP Row -->
            <div class="result-row otp-row" id="otp-row">
              <span class="result-row-label">OTP Code</span>
              <div class="otp-code-line">
                <span
                  class="result-row-value mono"
                  id="otp-code-value"
                  aria-label="OTP code"
                ></span>
                <button
                  id="copy-btn"
                  class="copy-btn"
                  type="button"
                  aria-label="Copy OTP code"
                  style="display: none"
                >
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                      d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"
                    />
                  </svg>
                  <span id="copy-label">Copy</span>
                </button>
              </div>
              <p class="sent-at" id="sent-at" style="display: none" aria-label="OTP sent time"></p>
            </div>
          </div>
        </div>
        <!-- .card-body -->

      </article>
    </main>

    <script>
      'use strict';

      // ── Elements ──────────────────────────────────────────────────
      const phoneInput   = document.getElementById('phone-input');
      const checkBtn     = document.getElementById('check-btn');
      const btnLabel     = document.getElementById('btn-label');
      const btnIcon      = document.getElementById('btn-icon');
      const spinner      = document.getElementById('spinner');
      const resultPanel  = document.getElementById('result-panel');
      const roleValue    = document.getElementById('role-value');
      const otpCodeValue = document.getElementById('otp-code-value');
      const copyBtn      = document.getElementById('copy-btn');
      const copyLabel    = document.getElementById('copy-label');
      const sentAt       = document.getElementById('sent-at');
      const savedSection = document.getElementById('saved-section');
      const savedList    = document.getElementById('saved-list');

      // ── Saved numbers (localStorage) ─────────────────────────────
      const STORAGE_KEY = 'saved_phones';
      const MAX_SAVED   = 5;

      function loadSaved() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        catch (_) { return []; }
      }

      function persistSaved(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      }

      function normalizePhone(raw) {
        let num = String(raw).trim().replace(/[-\s]/g, '');
        if (num.startsWith('+62')) return '62' + num.slice(3);
        if (num.startsWith('62'))  return num;
        if (num.startsWith('0'))   return '62' + num.slice(1);
        return '62' + num;
      }

      function savePhone(rawInput) {
        const normalized = normalizePhone(rawInput);
        let list = loadSaved();
        if (list.find(function(e) { return e.phone === normalized; })) {
          renderSaved(); return;
        }
        if (list.length >= MAX_SAVED) list.shift();
        list.push({ phone: normalized, alias: '', savedAt: new Date().toISOString() });
        persistSaved(list);
        renderSaved();
      }

      function deletePhone(normalized) {
        persistSaved(loadSaved().filter(function(e) { return e.phone !== normalized; }));
        renderSaved();
      }

      function saveAlias(normalized, alias) {
        const list = loadSaved().map(function(e) {
          return e.phone === normalized ? Object.assign({}, e, { alias: alias.trim() }) : e;
        });
        persistSaved(list);
        renderSaved();
      }

      function renderSaved() {
        const list = loadSaved();
        savedSection.style.display = list.length ? 'block' : 'none';
        savedList.innerHTML = '';

        list.forEach(function(entry) {
          const row = document.createElement('div');
          row.className = 'saved-entry';

          const fillEl = document.createElement('div');
          fillEl.className = 'saved-fill';
          fillEl.title = 'Click to fill';

          if (entry.alias) {
            const aliasEl = document.createElement('span');
            aliasEl.className = 'saved-alias';
            aliasEl.textContent = entry.alias;
            fillEl.appendChild(aliasEl);
            const phoneEl = document.createElement('span');
            phoneEl.className = 'saved-phone';
            phoneEl.textContent = entry.phone;
            fillEl.appendChild(phoneEl);
          } else {
            const phoneEl = document.createElement('span');
            phoneEl.className = 'saved-phone-only';
            phoneEl.textContent = entry.phone;
            fillEl.appendChild(phoneEl);
          }

          fillEl.addEventListener('click', function() {
            phoneInput.value = entry.phone;
            phoneInput.focus();
          });

          // Edit alias button
          const editBtn = document.createElement('button');
          editBtn.className = 'saved-icon-btn edit';
          editBtn.type = 'button';
          editBtn.title = 'Set alias';
          editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
          editBtn.addEventListener('click', function(ev) {
            ev.stopPropagation();
            const existing = row.querySelector('.alias-edit-row');
            if (existing) { existing.remove(); return; }
            const editRow = document.createElement('div');
            editRow.className = 'alias-edit-row';
            const inp = document.createElement('input');
            inp.className = 'alias-input';
            inp.type = 'text';
            inp.maxLength = 32;
            inp.placeholder = 'e.g. John Doe';
            inp.value = entry.alias || '';
            const saveBtn = document.createElement('button');
            saveBtn.className = 'alias-save-btn';
            saveBtn.type = 'button';
            saveBtn.textContent = 'Save';
            saveBtn.addEventListener('click', function() {
              saveAlias(entry.phone, inp.value);
            });
            inp.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') saveAlias(entry.phone, inp.value);
              if (e.key === 'Escape') editRow.remove();
            });
            editRow.appendChild(inp);
            editRow.appendChild(saveBtn);
            row.appendChild(editRow);
            inp.focus();
          });

          // Delete button
          const delBtn = document.createElement('button');
          delBtn.className = 'saved-icon-btn delete';
          delBtn.type = 'button';
          delBtn.title = 'Remove';
          delBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
          delBtn.addEventListener('click', function() {
            deletePhone(entry.phone);
          });

          row.appendChild(fillEl);
          row.appendChild(editBtn);
          row.appendChild(delBtn);
          savedList.appendChild(row);
        });
      }

      // ── State ──────────────────────────────────────────────────────
      let loading = false;
      let currentOtp = null;
      let currentRoleLabel = null;
      let currentLoginInstruction = null;
      let copyTimeout = null;

      // ── Helpers ────────────────────────────────────────────────────

      function setLoading(on) {
        loading = on;
        checkBtn.disabled = on;
        spinner.style.display = on ? 'block' : 'none';
        btnIcon.style.display = on ? 'none' : 'block';
        btnLabel.textContent = on ? 'Checking…' : 'Check';
      }

      /** Format an ISO date string for display. */
      function formatSentAt(raw) {
        if (!raw) return '';
        try {
          return new Date(raw).toLocaleString('id-ID', {
            dateStyle: 'medium',
            timeStyle: 'medium',
            timeZone: 'Asia/Jakarta',
          });
        } catch (_) {
          return raw;
        }
      }

      /** Render role value */
      function renderRole(role_label) {
        currentRoleLabel = role_label;
        if (role_label) {
          roleValue.textContent = role_label;
          roleValue.className = 'result-row-value info';
        } else {
          roleValue.textContent = '—';
          roleValue.className = 'result-row-value dim';
        }
      }

      /** Render OTP section */
      function renderOtp({ otp_code, sent_at, otp_failed }) {
        currentOtp = null;

        if (otp_failed) {
          // Call itself failed
          otpCodeValue.textContent = 'Failed to get OTP — try again';
          otpCodeValue.className = 'result-row-value danger';
          copyBtn.style.display = 'none';
          sentAt.style.display = 'none';
          return;
        }

        if (!otp_code) {
          // Successful call but empty
          otpCodeValue.textContent = 'Not Found';
          otpCodeValue.className = 'result-row-value warn';
          copyBtn.style.display = 'none';
          sentAt.style.display = 'none';
          return;
        }

        // Happy path — code present
        currentOtp = otp_code;
        otpCodeValue.textContent = otp_code;
        otpCodeValue.className = 'result-row-value mono success';
        copyBtn.style.display = 'inline-flex';

        if (sent_at) {
          sentAt.textContent = 'Sent ' + formatSentAt(sent_at);
          sentAt.style.display = 'block';
        } else {
          sentAt.style.display = 'none';
        }
      }

      // ── Copy OTP (+ login instruction ONLY when role_label exists) ─────
      copyBtn.addEventListener('click', async () => {
        if (!currentOtp) return;
        const text = (currentRoleLabel && currentLoginInstruction)
          ? currentOtp + '\n\n' + currentLoginInstruction
          : currentOtp;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.classList.add('copied');
          copyLabel.textContent = 'Copied!';
          clearTimeout(copyTimeout);
          copyTimeout = setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyLabel.textContent = 'Copy';
          }, 2000);
        } catch (err) {
          console.warn('[Clipboard] Could not copy:', err);
        }
      });

      // ── Check ──────────────────────────────────────────────────────
      async function doCheck() {
        const phone = phoneInput.value.trim();
        if (!phone) {
          phoneInput.focus();
          return;
        }
        if (loading) return;

        setLoading(true);
        resultPanel.classList.remove('visible');

        try {
          const resp = await fetch('/api/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone }),
          });

          if (!resp.ok) {
            const body = await resp.json().catch(() => ({}));
            throw new Error(body.error || `HTTP ${resp.status}`);
          }

          const data = await resp.json();
          currentLoginInstruction = data.login_instruction || null;
          renderRole(data.role_label);
          renderOtp(data);
          resultPanel.classList.add('visible');
          // Save if checkbox is checked
          const saveCb = document.getElementById('save-cb');
          if (saveCb && saveCb.checked) {
            savePhone(phone);
            saveCb.checked = false;
          }
        } catch (err) {
          console.error('[Check] Error:', err);
          // Show a generic failure in the OTP panel
          renderRole(null);
          renderOtp({ otp_code: null, sent_at: null, otp_failed: true });
          resultPanel.classList.add('visible');
        } finally {
          setLoading(false);
        }
      }

      // ── Event Listeners ────────────────────────────────────────────
      checkBtn.addEventListener('click', doCheck);

      phoneInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doCheck();
      });

      // Auto-focus input on load
      phoneInput.focus();
      renderSaved();
    </script>
  </body>
</html>
